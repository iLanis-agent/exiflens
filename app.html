<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExifLens - see what your photos reveal</title>
<style>
:root{--bg:#0b0e14;--panel:#121722;--line:#232c3d;--fg:#dbe4f0;--dim:#7d8ba1;--acc:#8be07a;--warn:#fbbf24;--err:#f87171;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;letter-spacing:.5px}
header h1 span{color:var(--acc)}
header .sub{color:var(--dim);font-size:13px}
.wrap{padding:18px 22px;max-width:1180px;margin:0 auto}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
button,.filebtn{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
button:hover,.filebtn:hover{border-color:var(--acc);color:var(--acc)}
button.active{border-color:var(--acc);color:var(--acc);background:#15230f}
input[type=file]{display:none}
.grid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.card img{max-width:100%;border-radius:8px;display:block}
.reveal{border-left:3px solid var(--warn);padding:8px 12px;margin:8px 0;background:#1c1a10;border-radius:0 8px 8px 0;font-size:13px}
.reveal b{color:var(--warn)}
.reveal.ok{border-left-color:var(--acc);background:#101c10}
.reveal.ok b{color:var(--acc)}
.reveal a{color:var(--acc)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
td:first-child{color:var(--dim);width:200px}
.empty{color:var(--dim);padding:30px 0;text-align:center}
.notice{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;display:none}
.notice.err{display:block;background:#2a1010;border:1px solid #6b1313;color:var(--err)}
footer{margin:26px 0 10px;text-align:center;color:var(--dim);font-size:12px}
footer a{color:var(--acc);text-decoration:none}
.group{font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:.5px;padding:10px 10px 4px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Exif<span>Lens</span></h1>
  <div class="sub">see what your photos reveal before you share them - 100% local, nothing uploaded</div>
</header>
<div class="wrap">
  <div class="controls">
    <label class="filebtn">Open a photo<input id="file" type="file" accept="image/jpeg,.jpg,.jpeg"></label>
    <span style="color:var(--dim);font-size:12px">presets:</span>
    <button data-preset="canon_gps">Canon + GPS</button>
    <button data-preset="apple_sw">iPhone, S/W refs</button>
    <button data-preset="minimal">minimal</button>
    <button data-preset="bigendian">big-endian</button>
    <button data-preset="littleendian">little-endian</button>
    <button data-preset="noexif">no EXIF</button>
  </div>
  <div id="err" class="notice err"></div>
  <div id="main" style="display:none">
    <div class="grid">
      <div>
        <div class="card"><h3>Photo</h3><img id="photo" alt="loaded photo"></div>
        <div class="card"><h3>What this photo reveals</h3><div id="reveals"></div></div>
      </div>
      <div class="card"><h3>Metadata</h3><div id="meta"></div></div>
    </div>
  </div>
  <div id="empty" class="empty">Open a JPEG or pick a preset. Parsing is 100% local in your browser.</div>
  <footer>ExifLens - engine verified against <a href="https://github.com/ianare/exif-py" target="_blank" rel="noopener">exifread</a> (90 field checks). <a href="index.html">about</a></footer>
</div>
<script src="engine.js"></script>

  h+=row('ISO',f.ISOSpeedRatings)+row('Exposure program',f.ExposureProgram!==undefined?(PROG[f.ExposureProgram]||f.ExposureProgram):'')+row('Exposure bias',f.ExposureBiasValue?(fmtRat(f.ExposureBiasValue)+' EV'):'')+row('Metering',f.MeteringMode!==undefined?(METER[f.MeteringMode]||f.MeteringMode):'')+row('Flash',f.Flash!==undefined?(f.Flash+' ('+((f.Flash&1)?'fired':'did not fire')+')'):'')+row('Focal length',f.FocalLength?(fmtRat(f.FocalLength)+' mm'):'')+row('Max aperture',f.MaxApertureValue?('f/'+fmtRat(f.ApexFNumber||f.MaxApertureValue)):'');
  h+='<tr class="group"><td colspan="2">Date &amp; time</td></tr>';
  h+=row('Taken (original)',esc(f.DateTimeOriginal||''))+row('File date/time',esc(f.DateTime||''))+row('GPS date',esc(f.GPSDateStamp||''));
  h+='<tr class="group"><td colspan="2">Location</td></tr>';
  if(f.GPSLatitudeDec!==undefined){
    h+=row('Coordinates','<a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat='+f.GPSLatitudeDec+'&mlon='+f.GPSLongitudeDec+'#map=15/'+f.GPSLatitudeDec+'/'+f.GPSLongitudeDec+'">'+f.GPSLatitudeDec+', '+f.GPSLongitudeDec+'</a>');
    if(f.GPSAltitudeSigned!==undefined)h+=row('Altitude',f.GPSAltitudeSigned+' m'+(f.GPSAltitudeRef===1?' (below sea level)':''));
  } else h+=row('Coordinates','<span style="color:var(--dim)">none</span>');
  h+='<tr class="group"><td colspan="2">File &amp; image</td></tr>';
  h+=row('File',esc(name))+row('EXIF byte order',r.byte_order==='II'?'little-endian (II)':(r.byte_order==='MM'?'big-endian (MM)':''))+row('EXIF version',Array.isArray(f.ExifVersion)?esc(String.fromCharCode.apply(null,f.ExifVersion)):esc(f.ExifVersion||''))+row('Pixel dimensions',f.PixelXDimension?(f.PixelXDimension+' x '+f.PixelYDimension):'')+row('Color space',f.ColorSpace!==undefined?(f.ColorSpace===1?'sRGB':(f.ColorSpace===65535?'uncalibrated':f.ColorSpace)):'')+row('X resolution',f.XResolution?fmtRat(f.XResolution,0):'')+row('Y resolution',f.YResolution?fmtRat(f.YResolution,0):'')+row('Resolution unit',f.ResolutionUnit===2?'inches':(f.ResolutionUnit===3?'cm':(f.ResolutionUnit||'')));
  h+='</table>';
  document.getElementById('meta').innerHTML=h;
}
document.getElementById('file').addEventListener('change',function(){
  var fl=this.files[0];if(!fl)return;
  var rd=new FileReader();
  rd.onload=function(){load(new Uint8Array(rd.result),fl.name,URL.createObjectURL(fl));};
  rd.readAsArrayBuffer(fl);
});
var btns=document.querySelectorAll('button[data-preset]');
for(var k=0;k<btns.length;k++){
  btns[k].addEventListener('click',function(){
    for(var m=0;m<btns.length;m++)btns[m].classList.remove('active');
    this.classList.add('active');
    var name=this.getAttribute('data-preset');
    var bytes=b64ToBytes(PRESETS[name]);
    var blob=new Blob([bytes],{type:'image/jpeg'});
    load(bytes,name+'.jpg (preset)',URL.createObjectURL(blob));
  });
}
</script>
</body>
</html>
